name: Compilar ExploraVida

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint y APK de depuracion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generar el wrapper de Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Limpiar
        run: ./gradlew clean --no-daemon

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Analisis lint
        run: ./gradlew lintDebug --no-daemon

      - name: Construir el APK de depuracion
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar el APK
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/ExploraVida-v1.0.0.apk
          sha256sum deliverables/ExploraVida-v1.0.0.apk > deliverables/ExploraVida-v1.0.0.apk.sha256
          cat deliverables/ExploraVida-v1.0.0.apk.sha256

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: ExploraVida-v1.0.0-apk
          path: |
            deliverables/ExploraVida-v1.0.0.apk
            deliverables/ExploraVida-v1.0.0.apk.sha256

      - name: Publicar informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
